name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Kit, manifests, circuit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      # Workspaces with peer dependencies need npm 11 (npm 10.9's tree
      # builder fails on them).
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build the kit, check manifests, contract.json, parity, packaging, tests
        run: npm run check

  rebuild:
    name: Reproducible build (${{ matrix.lineage }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        lineage: [counter, shielded-token, token-factory, holder-registry, attestation-vault, attestation-vault-32]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build the kit
        run: npm run build

      - name: Install the Compact toolchain
        run: |
          curl -fsSL https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A fresh compile from the committed source must reproduce the committed
      # module, zkir, verifier keys and the prover keys keys/manifest.json pins.
      - name: Compile ${{ matrix.lineage }} into a scratch tree
        run: |
          set -euo pipefail
          mkdir -p .build/${{ matrix.lineage }}
          cp -r packages/${{ matrix.lineage }}/src .build/${{ matrix.lineage }}/src
          cp -r packages/${{ matrix.lineage }}/managed .build/${{ matrix.lineage }}/managed
          find .build/${{ matrix.lineage }}/managed -name '*.prover' -delete
          COMPACT_ROOT=.build bash scripts/compile.sh ${{ matrix.lineage }}

      - name: Compare with the committed artifact
        run: node scripts/check-rebuild.mjs ${{ matrix.lineage }} .build/${{ matrix.lineage }}/managed/${{ matrix.lineage }}
